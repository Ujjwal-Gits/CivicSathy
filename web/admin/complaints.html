<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Complaints - CivicPulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { blue: '#3D52A2' } }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden">
    <!-- Admin Sidebar (Same as index) -->
    <aside class="w-64 bg-gray-900 text-white flex flex-col flex-shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-gray-800">
            <span class="text-xl font-bold">CivicPulse <span class="text-brand-blue">Admin</span></span>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="index.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 rounded-lg gap-3">Dashboard</a>
            <a href="complaints.html" class="flex items-center px-4 py-3 bg-gray-800 text-white rounded-lg gap-3">Complaints</a>
            <a href="users.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 rounded-lg gap-3">Users</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8">
            <h1 class="text-xl font-bold text-gray-800">Complaint Management</h1>
        </header>
        
        <div class="flex-1 overflow-y-auto p-8">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200">
                <div class="p-4 border-b border-gray-200 flex flex-wrap gap-4 items-center justify-between">
                    <div class="flex gap-2">
                        <select class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm outline-none focus:ring-1 focus:ring-brand-blue">
                            <option>All Statuses</option>
                            <option>Pending</option>
                            <option>In Progress</option>
                            <option>Resolved</option>
                        </select>
                        <select class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm outline-none focus:ring-1 focus:ring-brand-blue">
                            <option>All Categories</option>
                            <option>Road</option>
                            <option>Water</option>
                        </select>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-gray-600">
                        <thead class="bg-gray-50 text-gray-500 uppercase text-xs font-semibold">
                            <tr>
                                <th class="px-6 py-3">ID</th>
                                <th class="px-6 py-3">Issue</th>
                                <th class="px-6 py-3">Area</th>
                                <th class="px-6 py-3">Status</th>
                                <th class="px-6 py-3">Action</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200">
                            <tr class="hover:bg-gray-50">
                                <td class="px-6 py-4 font-medium">MET-2026-0341</td>
                                <td class="px-6 py-4 max-w-xs truncate">Pothole on Main St.</td>
                                <td class="px-6 py-4">Ward 5</td>
                                <td class="px-6 py-4"><span class="bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full text-xs font-medium">PENDING</span></td>
                                <td class="px-6 py-4"><button class="text-brand-blue hover:underline font-medium">Update</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
