<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - CivicPulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { blue: '#3D52A2', red: '#9E0A0F' } },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/globals.css">
</head>
<body class="bg-gray-50">
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 h-16 flex items-center px-4 sm:px-8">
        <a href="dashboard.html" class="flex items-center text-gray-600 hover:text-brand-blue font-medium">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Dashboard
        </a>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-8">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 md:p-8">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">Your Profile</h2>
            
            <form class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Full Name</label>
                    <input type="text" value="Ram Sharma" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-brand-blue sm:text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email (Cannot be changed)</label>
                    <input type="email" value="ram@example.com" disabled class="mt-1 block w-full px-4 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-500 sm:text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Phone</label>
                    <input type="tel" value="9841234567" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-brand-blue sm:text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Ward</label>
                    <input type="number" value="5" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-brand-blue sm:text-sm">
                </div>
                
                <div class="pt-4 flex gap-4">
                    <button type="submit" class="flex-1 bg-brand-blue text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-800 transition-colors">Save Changes</button>
                    <button type="button" class="flex-1 bg-red-50 text-brand-red px-4 py-2 rounded-lg font-medium hover:bg-red-100 border border-red-200 transition-colors">Logout</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
