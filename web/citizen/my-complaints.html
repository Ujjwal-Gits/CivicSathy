<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Complaints - CivicPulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { blue: '#3D52A2', red: '#9E0A0F' } },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/globals.css">
</head>
<body class="bg-gray-50">
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 h-16 flex items-center px-4 sm:px-8">
        <a href="dashboard.html" class="flex items-center text-gray-600 hover:text-brand-blue font-medium">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back
        </a>
        <h1 class="ml-auto font-bold text-lg">My Complaints</h1>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <ul class="divide-y divide-gray-200">
                <li class="p-4 sm:p-6 hover:bg-gray-50 transition-colors">
                    <a href="complaint-detail.html" class="flex flex-col sm:flex-row gap-4 items-start sm:items-center">
                        <img src="https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?w=200" alt="" class="w-full sm:w-24 h-24 object-cover rounded-lg">
                        <div class="flex-1">
                            <div class="flex items-center justify-between mb-1">
                                <h3 class="text-lg font-bold text-gray-900">Pothole on Main St</h3>
                                <span class="bg-yellow-100 text-yellow-800 text-xs px-2 py-1 rounded-full font-medium">PENDING</span>
                            </div>
                            <p class="text-sm text-gray-500 mb-2">Submitted on Oct 24, 2026</p>
                            <p class="text-sm text-gray-600 line-clamp-1">Huge pothole causing traffic issues near the junction...</p>
                        </div>
                    </a>
                </li>
                <!-- Empty state fallback could go here if no complaints -->
            </ul>
        </div>
    </main>
</body>
</html>
